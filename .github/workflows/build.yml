name: Build Daikura KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev libelf-dev

      - name: Setup Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Integrate KernelSU Next
        run: |
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang

          make O=out vendor/msm8953-perf_defconfig
          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AK3/anykernel.sh
          find out/arch/arm64/boot/ -name "Image.gz-dtb" -exec cp {} AK3/Image.gz-dtb \; 2>/dev/null || \
          find out/arch/arm64/boot/ -name "Image.gz" -exec cp {} AK3/Image.gz \; 2>/dev/null || \
          find out/arch/arm64/boot/ -name "Image" -exec cp {} AK3/Image \;
          cd AK3
          zip -r9 ../Daikura-KSU-Next-daisy.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Daikura-KSU-Next-daisy
          path: Daikura-KSU-Next-daisy.zip
