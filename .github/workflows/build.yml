name: Build Daikura KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev libelf-dev

      - name: Setup Toolchain (AOSP Clang)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Integrate KernelSU Next
        run: |
          rm -rf KernelSU drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out vendor/msm8953-perf_defconfig
          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AK3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb AK3/Image.gz-dtb 2>/dev/null || cp out/arch/arm64/boot/Image.gz AK3/Image.gz || cp out/arch/arm64/boot/Image AK3/Image
          cd AK3
          zip -r9 ../Daikura-KSU-Next-daisy.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Daikura-KSU-Next-daisy
          path: Daikura-KSU-Next-daisy.zip
